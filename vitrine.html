<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MIND - VITRINE 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000; overflow:hidden; font-family:'JetBrains Mono'}
#canvas{position:fixed; inset:0; z-index:1}
#entry{position:fixed; inset:0; z-index:9999; background:#000; display:grid; place-items:center; overflow:hidden}
#entry.hide{animation:fadeOut 1s ease forwards}
@keyframes fadeOut{to{opacity:0; visibility:hidden}}
.entryBg{position:absolute; inset:0; background:radial-gradient(ellipse at center, rgba(0,170,255,0.25), #000 70%)}
.portalWrap{position:relative; width:300px; height:300px; display:grid; place-items:center}
.ring{position:absolute; inset:0; border:1px solid rgba(0,170,255,0.5); border-radius:50%; box-shadow:0 0 40px rgba(0,170,255,0.3)}
.ringDashed{position:absolute; inset:-15px; border:1px dashed rgba(0,170,255,0.25); border-radius:50%; animation:spin 12s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.entryLogo{font-family:Inter; font-weight:900; font-size:3.4rem; color:#fff; letter-spacing:-2px; position:relative; z-index:2; transform:none !important}
.entryLogo b{color:#00aaff; text-shadow:0 0 20px #00aaff}
.entrySub{position:absolute; bottom:18%; left:0; right:0; text-align:center; color:#00aaff; font-size:0.62rem; letter-spacing:3px; line-height:1.6}
.scan{position:absolute; left:0; width:100%; height:2px; background:linear-gradient(90deg, transparent, #00aaff, #fff, transparent); box-shadow:0 0 20px #00aaff; top:0; animation:scan 2.5s ease infinite}
@keyframes scan{0%{top:0%} 100%{top:100%}}
#tooltip{position:fixed; background:rgba(0,15,40,0.95); border:1px solid #00aaff; color:#fff; padding:8px 12px; border-radius:8px; font-size:0.7rem; pointer-events:none; display:none; z-index:20}
#hud{position:fixed; inset:0; z-index:10; pointer-events:none}
.top{position:absolute; top:16px; left:16px; right:16px; display:flex; justify-content:space-between; pointer-events:auto; gap:8px}
.search{background:rgba(0,15,40,0.85); border:1px solid #00aaff44; border-radius:100px; padding:8px 14px; backdrop-filter:blur(10px)}
.search input{background:transparent; border:none; color:#fff; outline:none; width:160px; font-family:'JetBrains Mono'; font-size:0.7rem}
</style>
</head>
<body>
<div id="entry">
  <div class="entryBg"></div>
  <div class="scan"></div>
  <div class="portalWrap">
    <div class="ring"></div>
    <div class="ringDashed"></div>
    <div class="entryLogo">MIND</div>
  </div>
  <div class="entrySub">VITRINE 3D • UNIVERSO DE EXPERIÊNCIAS •<br>CARREGANDO</div>
</div>

<canvas id="canvas"></canvas>
<div id="tooltip"></div>
<div id="hud">
  <div class="top">
    <div class="search">🔍 <input id="search" placeholder="PESQUISAR..." oninput="if(window.filtrar) filtrar()"></div>
    <div style="color:#6aa; font-size:0.55rem; background:rgba(0,0,0,0.6); padding:8px 12px; border-radius:100px; border:1px solid #ffffff15">ARRASTE PARA EXPLORAR • CLIQUE NA PLATAFORMA</div>
  </div>
</div>

<script>
// ESSE SCRIPT RODA MESMO SE O 3D QUEBRAR - GARANTE QUE A TELA SOME
setTimeout(function(){
  var e=document.getElementById('entry');
  if(e){ e.classList.add('hide'); setTimeout(function(){ e.style.display='none'; }, 1000); }
}, 2600);
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const CLIENTES = [
  {nome:"Sushi Master", cat:"Restaurantes", logo:"🍣", cor:0xff3b3b, desc:"Japonês premium"},
  {nome:"Barbearia Old Money", cat:"Barbearias", logo:"💈", cor:0x00aaff, desc:"Corte clássico"},
  {nome:"FitPower", cat:"Academias", logo:"🏋️", cor:0x00ff88, desc:"Academia 24h"},
  {nome:"Bella Moda", cat:"Lojas", logo:"👗", cor:0xa78bfa, desc:"Moda feminina"},
  {nome:"AutoPrime", cat:"Serviços", logo:"🔧", cor:0x00f0ff, desc:"Oficina premium"},
  {nome:"Marmoris Móveis", cat:"Empresas", logo:"🪑", cor:0x7c5cff, desc:"Móveis planejados"},
];

const scene=new THREE.Scene(); scene.background=new THREE.Color(0x020208);
const camera=new THREE.PerspectiveCamera(65, innerWidth/innerHeight, 0.1, 100); camera.position.set(0,6,13);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('canvas'), antialias:true}); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
const controls=new OrbitControls(camera, renderer.domElement); controls.enableDamping=true; controls.dampingFactor=0.08; controls.minDistance=4; controls.maxDistance=20; controls.autoRotate=true; controls.autoRotateSpeed=0.5;

scene.add(new THREE.AmbientLight(0x334466,1));
const p1=new THREE.PointLight(0x00aaff, 2.5, 30); p1.position.set(-8,5,0); scene.add(p1);
const p2=new THREE.PointLight(0x7c5cff, 2, 30); p2.position.set(8, -2, 8); scene.add(p2);

const group=new THREE.Group(); scene.add(group);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60,20,20), new THREE.MeshBasicMaterial({color:0x00aaff, wireframe:true, transparent:true, opacity:0.04})); floor.rotation.x=-Math.PI/2; floor.position.y=-3.5; scene.add(floor);

CLIENTES.forEach((c,i)=>{
  const angle=(i/CLIENTES.length)*Math.PI*2; const r=5.5;
  const g=new THREE.Group(); g.position.set(Math.cos(angle)*r, Math.sin(i*0.8)*0.6, Math.sin(angle)*r);
  const base=new THREE.Mesh(new THREE.CylinderGeometry(1,1.2,0.35,20), new THREE.MeshStandardMaterial({color:0x0a1a33, emissive:new THREE.Color(c.cor), emissiveIntensity:0.25}));
  const ring=new THREE.Mesh(new THREE.RingGeometry(1.25,1.35,24), new THREE.MeshBasicMaterial({color:c.cor, transparent:true, opacity:0.7, side:THREE.DoubleSide})); ring.rotation.x=Math.PI/2; ring.position.y=0.3;
  const logo=new THREE.Mesh(new THREE.SphereGeometry(0.32,16,16), new THREE.MeshBasicMaterial({color:c.cor})); logo.position.y=1;
  g.add(base, ring, logo); g.userData=c; group.add(g);
});

const ray=new THREE.Raycaster(); const mouse=new THREE.Vector2();
const tooltip=document.getElementById('tooltip');
addEventListener('mousemove', e=>{
  mouse.x=(e.clientX/innerWidth)*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
  tooltip.style.left=e.clientX+14+'px'; tooltip.style.top=e.clientY+14+'px';
});
addEventListener('click', e=>{
  const m=new THREE.Vector2((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(m, camera);
  const hits=ray.intersectObjects(group.children, true);
  if(hits.length){
    let o=hits[0].object; while(o.parent && !o.userData.nome) o=o.parent;
    if(o.userData.nome){ alert(o.userData.nome + " - " + o.userData.desc + "\n\nAqui vai abrir o site: vitrine completa vem na próxima versão."); }
  }
});

function animate(){
  requestAnimationFrame(animate);
  group.children.forEach((g,i)=>{
    g.position.y += Math.sin(Date.now()*0.001 + i)*0.002;
    g.rotation.y += 0.005;
  });
  controls.update();
  renderer.render(scene,camera);
  // tooltip hover
  ray.setFromCamera(mouse, camera);
  const inter=ray.intersectObjects(group.children, true);
  if(inter.length){
    let o=inter[0].object; while(o.parent && !o.userData.nome) o=o.parent;
    if(o.userData.nome){ tooltip.innerHTML=`<b style="color:#${o.userData.cor.toString(16).padStart(6,'0')}">${o.userData.logo} ${o.userData.nome}</b><br><span style="color:#8ab">${o.userData.cat} • CLIQUE</span>`; tooltip.style.display='block'; }
  } else { tooltip.style.display='none'; }
}
animate();
addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
